<!-- ✨ [페이지 2] 맹원 주간활동 통계 룸 뷰 -->
<main id="view-stats" class="hidden flex-1 p-3 sm:p-6 md:p-8 overflow-y-auto space-y-6">
    <!-- 상단 요약 카드 (인원수 / 평균 번영도 / 평균 무훈 / 평균 공헌 / 평균 공성) -->
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-4">
        <div class="bg-panel border border-theme p-4 rounded-xl shadow">
            <p class="text-xs text-muted font-medium mb-1">인원수</p>
            <h3 id="statTotalMembers" class="text-xl font-extrabold gold-text">0명</h3>
        </div>
        <div class="bg-panel border border-theme p-4 rounded-xl shadow">
            <p class="text-xs text-muted font-medium mb-1">평균 번영도</p>
            <h3 id="statAvgProsperity" class="text-xl font-extrabold text-main">0</h3>
        </div>
        <div class="bg-panel border border-theme p-4 rounded-xl shadow">
            <p class="text-xs text-muted font-medium mb-1">평균 무훈</p>
            <h3 id="statAvgMhoon" class="text-xl font-extrabold text-yellow-500">0</h3>
        </div>
        <div class="bg-panel border border-theme p-4 rounded-xl shadow">
            <p class="text-xs text-muted font-medium mb-1">평균 공헌</p>
            <h3 id="statAvgContribution" class="text-xl font-extrabold text-emerald-400">0</h3>
        </div>
        <div class="bg-panel border border-theme p-4 rounded-xl shadow col-span-2 sm:col-span-1">
            <p class="text-xs text-muted font-medium mb-1">평균 공성</p>
            <h3 id="statAvgSiege" class="text-xl font-extrabold text-blue-400">0회</h3>
        </div>
    </div>

    <!-- 활약도 평가 영역 (주간 무훈 순위 / 주간 공헌도 순위 / 주간 공성횟수 순위) -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
        <div class="bg-panel border border-theme p-5 rounded-xl shadow">
            <h3 class="text-sm font-bold gold-text mb-3 flex items-center gap-1.5"><span>⚔️</span> 주간 무훈 순위 TOP 5</h3>
            <div id="topMhoonList" class="space-y-2 text-xs text-main"></div>
        </div>
        <div class="bg-panel border border-theme p-5 rounded-xl shadow">
            <h3 class="text-sm font-bold text-emerald-400 mb-3 flex items-center gap-1.5"><span>🏆</span> 주간 공헌도 순위 TOP 5</h3>
            <div id="topContribList" class="space-y-2 text-xs text-main"></div>
        </div>
        <div class="bg-panel border border-theme p-5 rounded-xl shadow">
            <h3 class="text-sm font-bold text-blue-400 mb-3 flex items-center gap-1.5"><span>🏰</span> 주간 공성횟수 순위 TOP 5</h3>
            <div id="topSiegeList" class="space-y-2 text-xs text-main"></div>
        </div>
    </div>

    <!-- 관리자 전용 저조 인원 관리 (하위 10%) -->
    <div id="adminLowBoxWrapper" class="bg-panel border border-red-500/40 p-5 rounded-xl shadow hidden">
        <h3 class="text-sm font-bold text-red-400 mb-3 flex items-center gap-1.5"><span>🔒 [관리자 전용] 3대 지표 종합 저조 인원 (하위 10%)</span></h3>
        <div id="lowExecutivesList" class="space-y-2 text-xs text-main"></div>
    </div>

    <!-- 하단 전체 리포트 테이블 영역 -->
    <div class="bg-panel border border-theme rounded-xl shadow-xl overflow-hidden flex flex-col">
        ... (기존 테이블 영역 유지) ...
    </div>
</main>
